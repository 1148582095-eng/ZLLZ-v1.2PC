<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>移动端 - 指令流转中心</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    body { background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 14px; padding: 36px 30px; max-width: 460px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.06); text-align: center; }
    .icon { width: 60px; height: 60px; margin: 0 auto 18px; border-radius: 14px; background: linear-gradient(135deg, #ecfdf5, #a7f3d0); color: #047857; display: flex; align-items: center; justify-content: center; font-size: 28px; }
    h1 { font-size: 20px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }
    p { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 24px; }
    .input-row { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; height: 38px; padding: 0 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 13.5px; outline: none; }
    input:focus { border-color: #009893; box-shadow: 0 0 0 3px rgba(0,152,147,0.15); }
    button.primary { background: #009893; color: #ffffff; border: none; height: 38px; padding: 0 18px; border-radius: 8px; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: background .15s; }
    button.primary:hover { background: #007a76; }
    a.btn-back { display: inline-block; margin-top: 14px; color: #009893; font-size: 13.5px; font-weight: 600; text-decoration: none; }
    a.btn-back:hover { text-decoration: underline; }
  </style>
  <script>
    (function(){
      var saved = localStorage.getItem("custom_link_mobile");
      if(saved && saved.trim()){
        window.location.replace(saved.trim());
      }
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="icon">📱</div>
    <h1>移动端跳转链接</h1>
    <p>移动端已调整为外部跳转链接。请配置移动端访问地址，保存后将自动跳转。</p>
    <div class="input-row">
      <input type="url" id="link-input" placeholder="输入链接（如 https://...）" />
      <button class="primary" onclick="saveAndJump()">保存并跳转</button>
    </div>
    <div>
      <a href="./index.html#/guide" class="btn-back">← 返回统一入口</a>
    </div>
  </div>

  <script>
    function normalizeUrl(url){
      if(!url) return "";
      url = url.trim();
      if(!url) return "";
      if(!/^https?:\/\//i.test(url) && !/^\/\//.test(url)){
        return "https://" + url;
      }
      return url;
    }
    function saveAndJump(){
      var inp = document.getElementById("link-input");
      var val = normalizeUrl(inp.value);
      if(!val){
        alert("请输入有效的访问链接");
        inp.focus();
        return;
      }
      localStorage.setItem("custom_link_mobile", val);
      window.location.href = val;
    }
    document.getElementById("link-input").addEventListener("keydown", function(e){
      if(e.key === "Enter") saveAndJump();
    });
  </script>
</body>
</html>
